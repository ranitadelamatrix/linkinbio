<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservá tu turno</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --ivory: #FAF7F2;
    --ink: #211E1A;
    --ink-soft: #55504A;
    --brass: #9C8259;
    --brass-soft: #E4D9C4;
    --line: #DCD4C4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    background: var(--ivory);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(156,130,89,0.07), transparent 40%),
      radial-gradient(circle at 85% 95%, rgba(156,130,89,0.06), transparent 40%);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 20px 40px;
  }

  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    animation: rise 0.7s ease-out forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .monogram {
    width: 76px;
    height: 76px;
    border: 1px solid var(--brass);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 30px;
    color: var(--brass);
    letter-spacing: 1px;
    margin-bottom: 22px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 40px;
    letter-spacing: 0.5px;
    text-align: center;
    line-height: 1.15;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--ink-soft);
    margin-top: 8px;
    text-align: center;
  }

  /* Divisor tipo "peine": líneas finas de altura variable, como signature del diseño */
  .comb-divider {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 26px;
    margin: 30px 0 34px;
  }
  .comb-divider span {
    width: 1px;
    background: var(--line);
    display: block;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 17px 20px;
    border-radius: 2px;
    text-decoration: none;
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.3px;
    transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .link-btn:active { transform: scale(0.98); }

  .link-btn.primary {
    background: var(--ink);
    color: var(--ivory);
    border: 1px solid var(--ink);
  }
  .link-btn.primary:hover { background: var(--brass); border-color: var(--brass); }

  .link-btn.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .link-btn.secondary:hover { border-color: var(--brass); color: var(--brass); }

  .link-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  footer {
    margin-top: 46px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.7;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; opacity: 1; }
  }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 3px;
  }
</style>
</head>
<body>
<main>
  <div class="monogram">SD</div>
  <p class="eyebrow">Turnos</p>
  <h1>Sofia Dentista</h1>
  <p class="tagline">Ortodoncia, Arreglos</p>

  <div class="comb-divider" aria-hidden="true" id="combDivider"></div>

  <nav class="links">
    <a class="link-btn primary" href="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ1zqLkaRHqmgIENJO1c1375jfI17kMslUNpUKymFciUePshrkNuS3baVa2ChAUrtUrJX_n7sTdQ" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      Reservar turno
    </a>

    <a class="link-btn secondary" href="https://wa.me/5493854172687" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.5 5.2L2 22l4.9-1.5C8.4 21.5 10.1 22 12 22c5.5 0 10-4.5 10-10S17.5 2 12 2zm5.4 14.2c-.2.7-1.3 1.3-1.8 1.4-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.5-.6-2.6-1.1-4.3-3.8-4.5-4-.1-.2-1-1.4-1-2.6s.6-1.8.9-2.1c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.2.1.4 0 .6-.1.2-.2.3-.3.5-.2.2-.3.3-.5.5-.2.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.5 1.6.3.1.5.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.7.8.2.1.4.2.4.3.1.3.1.7-.1 1.4z"/></svg>
      WhatsApp
    </a>

    <a class="link-btn secondary" href="https://instagram.com/gasprograma" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/></svg>
      Instagram
    </a>
  </nav>

  <footer>Villa Maria</footer>
</main>

<script>
  // Genera las líneas del "peine" (elemento distintivo del diseño)
  (function () {
    const container = document.getElementById('combDivider');
    const heights = [8, 14, 20, 26, 20, 14, 8, 14, 20, 14, 8];
    heights.forEach(h => {
      const line = document.createElement('span');
      line.style.height = h + 'px';
      container.appendChild(line);
    });
  })();
</script>
</body>
</html>
